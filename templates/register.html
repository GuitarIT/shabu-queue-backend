<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ร้านชาบูอ้วนกลม (Queue Booking System)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-shabu py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <img src="/static/img/logo.png" alt="โลโก้ร้านชาบูอ้วนกลม" class="brand-logo-img">
                <span>ร้านชาบูอ้วนกลม <small class="fw-normal opacity-75 d-none d-sm-inline">| ระบบจองคิวออนไลน์</small></span>
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card card-shabu p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-logo-card mb-3">
                            <img src="/static/img/logo.png" alt="โลโก้ร้านชาบูอ้วนกลม">
                        </div>
                        <h3 class="fw-bold mb-1">สมัครสมาชิกสำหรับลูกค้า</h3>
                        <p class="text-muted small mb-0">ลงทะเบียนเพื่อจองคิวและเช็กสถานะคิวร้านชาบูอ้วนกลม</p>
                    </div>

                    {{if .Error}}
                    <div class="alert alert-danger d-flex align-items-center rounded-3 py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>{{.Error}}</div>
                    </div>
                    {{end}}

                    <form method="POST" action="/register" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-medium">ชื่อ - นามสกุล หรือ ชื่อเล่น</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill text-danger"></i></span>
                                <input type="text" class="form-control" id="name" name="name"
                                       value="{{.Name}}" placeholder="เช่น คุณสมชาย สายชาบู" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone_number" class="form-label fw-medium">เบอร์โทรศัพท์ (ใช้สำหรับเข้าสู่ระบบ)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone-fill text-danger"></i></span>
                                <input type="text" class="form-control" id="phone_number" name="phone_number"
                                       value="{{.PhoneNumber}}" placeholder="ตัวเลข 9-10 หลัก เช่น 0812345678" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-danger"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="ตั้งรหัสผ่านของคุณ" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-medium">ยืนยันรหัสผ่านอีกครั้ง</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock-fill text-danger"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                       placeholder="กรอกรหัสผ่านซ้ำอีกครั้ง" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-shabu w-100 py-2 mb-3">
                            <i class="bi bi-person-check-fill me-1"></i> ยืนยันการสมัครสมาชิก
                        </button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <span class="text-muted small">มีบัญชีผู้ใช้อยู่แล้ว?</span>
                        <a href="/login" class="fw-semibold text-danger text-decoration-none ms-1">เข้าสู่ระบบ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
